name: Daily Gita Post

on:
  schedule:
    - cron: "30 3 * * *"   # 09:00 AM IST
    - cron: "30 12 * * *"  # 06:00 PM IST
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  post:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install pillow requests

      - name: Generate today's verse card
        working-directory: gita_project/scripts
        run: python daily_post.py

      - name: Commit generated images
        run: |
          git config user.name "gita-bot"
          git config user.email "gita-bot@users.noreply.github.com"
          git add gita_project/output/*.png gita_project/data/state.json gita_project/data/run_meta.json
          git commit -m "Auto: prepare verse post $(date -u +%Y-%m-%d)" || echo "Nothing to commit"
          git push

      - name: Publish to Instagram
        working-directory: gita_project/scripts
        env:
          IG_USER_ID: ${{ secrets.IG_USER_ID }}
          IG_ACCESS_TOKEN: ${{ secrets.IG_ACCESS_TOKEN }}
        run: python post_to_instagram.py
